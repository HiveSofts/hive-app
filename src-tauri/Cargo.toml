[package]
name = "hive-app"
version = "0.1.0"
description = "Hive - Cross-platform local development environment"
authors = ["Arshia Mohammadi <itarrshia@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/LaraPire/hive-app"

[lib]
name = "hive_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
reqwest = { version = "0.13.4", features = ["stream", "json"] }
flate2 = "1.1.9"
tar = "0.4.46"
zip = "8.6.0"
futures-util = "0.3.32"
liblzma = "0.4.6"
zstd = "0.13.3"
uuid = { version = "1.23.3", features = ["v4"] }
regex = "1.12.4"
rand = "0.8.5"
tokio = { version = "1.52.3", features = ["full"] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2.3.5"
libc = "0.2.186"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-positioner = "2.3.2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-cli = "2"
